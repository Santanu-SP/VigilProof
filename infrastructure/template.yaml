AWSTemplateFormatVersion: "2010-09-09"
Description: VigilProof Day-1 AWS foundation

Parameters:
  NovaModelId:
    Type: String
    Description: Amazon Nova 2 Lite inference profile ID used from the deployment region
    Default: global.amazon.nova-2-lite-v1:0

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expireAt
        Enabled: true

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VigilProofDay1Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EvidenceStorage
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${EvidenceBucket.Arn}/cases/*"
              - Sid: ListEvidenceBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EvidenceBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: cases/*
              - Sid: CaseRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt CasesTable.Arn
              - Sid: InvokeNova
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${NovaModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-2-lite-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:::foundation-model/amazon.nova-2-lite-v1:0"
              - Sid: ManageBuiltInBrowserSessions
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartBrowserSession
                  - bedrock-agentcore:GetBrowserSession
                  - bedrock-agentcore:StopBrowserSession
                Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:browser/aws.browser.v1"
              - Sid: ConnectBrowserAutomation
                Effect: Allow
                Action: bedrock-agentcore:ConnectBrowserAutomationStream
                Resource: "*"
              - Sid: WriteApplicationLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ApplicationLogGroup.Arn}:*"

Outputs:
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  CasesTableName:
    Value: !Ref CasesTable
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  ApplicationLogGroupName:
    Value: !Ref ApplicationLogGroup
